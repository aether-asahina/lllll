<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surat Malam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Pinyon+Script&display=swap">
<style>
/* Layout: satu panggung di tengah. Amplop tertutup lebih dulu, lalu kelopaknya terbuka dan berganti menjadi kartu surat; kelopak mawar jatuh di atasnya. Kontrol nama ada di atas. */
:root {
  --night: #170b14;
  --wine: #8c2a4e;
  --rose: #d9577a;
  --paper: #f7ece7;
  --ink: #3b1b29;
  --gold: #d8b17c;
  --muted-ink: #7d4a5e;
  --glow: #3a1226;
  --soft: #e9c9d4;
  --env-back: #6b2440;
  --env-front: #86304f;
  --env-flap: #a23b5b;
  --font-display: 'Pinyon Script', 'Snell Roundhand', cursive;
  --font-body: 'Newsreader', Georgia, serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  box-sizing: border-box;
  padding-inline: 16px;
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  background: radial-gradient(120% 70% at 50% 38%, var(--glow) 0%, transparent 70%), var(--night);
  color: var(--soft);
  font-family: var(--font-body);
  overflow-x: hidden;
}

/* kontrol nama */
.ctrl { width: min(100%, 440px); display: flex; gap: 12px; flex-wrap: wrap; }
.ctrl label { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 6px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
.ctrl input { font: inherit; font-family: var(--font-body); font-size: 16px; letter-spacing: 0; text-transform: none;
  color: #fbeaf0; background: rgba(255,255,255,.07); border: 1px solid rgba(233,201,212,.3); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.ctrl input::placeholder { color: #b98ea0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* panggung */
.stage { flex: 1; width: 100%; display: grid; place-items: center; align-content: center; gap: 18px; }
.stage > * { grid-area: 1 / 1; }
.hint { align-self: end; margin-top: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); transition: opacity .4s; }

/* amplop */
.envelope { appearance: none; border: 0; padding: 0; background: none; cursor: pointer; position: relative;
  width: min(86vw, 340px); aspect-ratio: 3 / 2; perspective: 900px; color: inherit;
  transition: opacity .6s ease, transform .7s ease; filter: drop-shadow(0 24px 30px rgba(0,0,0,.55)); }
.envelope > * { position: absolute; }
.env-back { inset: 0; background: var(--env-back); border-radius: 6px; }
.env-front { inset: 0; background: var(--env-front); border-radius: 6px; clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%); z-index: 2; }
.env-to { left: 0; right: 0; bottom: 13%; z-index: 3; display: grid; justify-items: center; gap: 0; pointer-events: none; }
.env-to small { font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #f0c9d6; }
.env-to span { font-family: var(--font-display); font-size: 2.1rem; line-height: 1.1; color: #fde9ef; max-width: 90%; overflow-wrap: anywhere; text-align: center; }
.flap { left: 0; right: 0; top: 0; height: 56%; background: var(--env-flap); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center;
  z-index: 4; transition: transform .75s cubic-bezier(.5,0,.2,1), z-index 0s .35s; }
.seal { left: 50%; top: 56%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; z-index: 5;
  background: radial-gradient(circle at 35% 30%, #f07a98, #b83358 70%); display: grid; place-items: center;
  box-shadow: 0 3px 8px rgba(0,0,0,.45); transition: opacity .3s; }
.seal svg { width: 22px; height: 22px; fill: #ffe4ec; }
.envelope:hover .seal { transform: scale(1.06); }
.envelope.opening .flap { transform: rotateX(180deg); z-index: 1; }
.envelope.opening .seal { opacity: 0; }
.is-open .envelope { opacity: 0; transform: translateY(28px) scale(.96); pointer-events: none; visibility: hidden; transition: opacity .6s ease, transform .7s ease, visibility 0s .7s; }
.is-open .hint { opacity: 0; }

/* kartu */
.card { position: relative; width: min(100%, 440px); box-sizing: border-box; padding: 38px 30px 26px;
  background: linear-gradient(160deg, #fcf4ef 0%, var(--paper) 55%, #f1e0da 100%); color: var(--ink); border-radius: 4px;
  box-shadow: 0 36px 70px -24px rgba(0,0,0,.7); opacity: 0; visibility: hidden; transform: translateY(26px) scale(.97);
  transition: opacity .8s ease .15s, transform .9s cubic-bezier(.2,.7,.2,1) .15s, visibility 0s .95s; }
.card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(184,140,90,.55); border-radius: 2px; pointer-events: none; }
.is-open .card { opacity: 1; visibility: visible; transform: none; transition: opacity .8s ease .15s, transform .9s cubic-bezier(.2,.7,.2,1) .15s, visibility 0s; }
.card-date { margin: 0 0 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-ink); }
.card h2 { margin: 0 0 18px; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 9vw, 2.9rem); line-height: 1.1; color: var(--wine); text-wrap: balance; overflow-wrap: anywhere; }
.msg p { margin: 0 0 .85em; font-size: 1.1rem; line-height: 1.7; max-width: 65ch; }
.msg .r { color: transparent; }
.sign { margin-top: 10px; opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease; }
.sign p { margin: 0; font-style: italic; color: var(--muted-ink); font-size: 1rem; }
.sign .name { font-family: var(--font-display); font-style: normal; font-size: 2.3rem; line-height: 1.15; color: var(--wine); overflow-wrap: anywhere; }
.card-foot { margin-top: 18px; display: flex; justify-content: flex-end; opacity: 0; transition: opacity .9s ease .3s; }
.done .sign, .done .card-foot { opacity: 1; transform: none; }
.again { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-ink);
  background: none; border: 1px solid rgba(125,74,94,.45); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.again:hover { background: rgba(140,42,78,.08); }

canvas#petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  .envelope, .flap, .card, .sign, .card-foot, .seal { transition-duration: .01s !important; transition-delay: 0s !important; }
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
</style>
</head>
<body>

<form class="ctrl" onsubmit="return false" aria-label="Nama di kartu">
  <label for="to">Untuk<input id="to" type="text" value="Sayang" maxlength="30" autocomplete="off" placeholder="Nama penerima"></label>
  <label for="from">Dari<input id="from" type="text" value="Aku" maxlength="30" autocomplete="off" placeholder="Namamu"></label>
</form>

<main class="stage" id="stage">
  <button class="envelope" id="env" type="button" aria-expanded="false" aria-label="Buka amplop">
    <span class="env-back"></span>
    <span class="env-to"><small>Untuk</small><span id="envTo">Sayang</span></span>
    <span class="env-front"></span>
    <span class="flap"></span>
    <span class="seal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
  </button>

  <article class="card" id="card" aria-live="polite">
    <p class="card-date" id="date"></p>
    <h2 id="hTo">Untuk Sayang,</h2>
    <div class="msg" id="msg"></div>
    <div class="sign">
      <p>Yang lagi jatuh cinta sama kamu,</p>
      <p class="name" id="sign">Aku</p>
    </div>
    <div class="card-foot"><button class="again" id="again" type="button">Tutup amplop</button></div>
  </article>
</main>

<p class="hint" id="hint">Ketuk amplop untuk membuka</p>
<canvas id="petals" aria-hidden="true"></canvas>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var stage = $('#stage'), env = $('#env'), card = $('#card'), msgBox = $('#msg');
  var toIn = $('#to'), fromIn = $('#from');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LINES = [
    'Aku masih belum percaya kamu beneran bilang iya.',
    'Sejak hari itu, aku sering buka hp cuma buat lihat ada kabar dari kamu atau nggak. Kalau ada, aku senyum sendirian kayak orang aneh.',
    'Aku belum jadi pacar yang sempurna, tapi aku mau belajar: dengerin kamu sampai habis, ingat hal-hal kecil yang kamu suka, dan nggak bikin kamu merasa sendirian.',
    'Terima kasih sudah memilih aku. Kita jalanin pelan-pelan, bareng-bareng. Aku mau jadi alasan kamu senyum paling lebar.'
  ];

  try {
    $('#date').textContent = 'Awal kita · ' + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) { $('#date').textContent = ''; }

  function names() {
    return { to: toIn.value.trim() || 'Kamu', from: fromIn.value.trim() || 'Aku' };
  }
  function syncNames() {
    var n = names();
    $('#envTo').textContent = n.to;
    $('#hTo').textContent = 'Untuk ' + n.to + ',';
    $('#sign').textContent = n.from;
  }
  toIn.addEventListener('input', syncNames);
  fromIn.addEventListener('input', syncNames);
  syncNames();

  /* mengetik */
  var token = 0, typing = false, skip = false;
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function build() {
    msgBox.textContent = '';
    return LINES.map(function (text) {
      var p = document.createElement('p');
      var t = document.createElement('span');
      var r = document.createElement('span');
      r.className = 'r';
      r.setAttribute('aria-hidden', 'true');
      r.textContent = text;
      p.appendChild(t); p.appendChild(r);
      msgBox.appendChild(p);
      return { t: t, r: r, text: text };
    });
  }
  function finishAll(items) {
    items.forEach(function (it) { it.t.textContent = it.text; it.r.textContent = ''; });
  }
  async function typeAll() {
    var my = ++token;
    typing = true; skip = false;
    card.classList.remove('done');
    var items = build();
    if (reduce) { finishAll(items); card.classList.add('done'); typing = false; return; }
    await sleep(500);
    for (var k = 0; k < items.length && !skip; k++) {
      var it = items[k];
      for (var i = 1; i <= it.text.length; i++) {
        if (my !== token) return;
        if (skip) break;
        it.t.textContent = it.text.slice(0, i);
        it.r.textContent = it.text.slice(i);
        var ch = it.text.charAt(i - 1);
        await sleep(ch === ',' || ch === ':' ? 170 : ch === '.' ? 260 : 26);
      }
      if (my !== token) return;
      it.t.textContent = it.text; it.r.textContent = '';
      await sleep(skip ? 0 : 280);
    }
    if (my !== token) return;
    finishAll(items);
    typing = false;
    card.classList.add('done');
  }
  card.addEventListener('click', function (e) {
    if (typing && !e.target.closest('button')) skip = true;
  });

  /* kelopak mawar */
  var cv = $('#petals'), ctx = cv.getContext('2d');
  var W = 0, H = 0, petals = [], raf = 0, spawnUntil = 0, lastSpawn = 0, lastT = 0;
  var COLORS = ['#d9577a', '#f2a3b8', '#e8809b', '#b73c61', '#f7c6d3'];
  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', size);
  size();
  function mk(burst) {
    return { x: Math.random() * W, y: burst ? -Math.random() * H * 0.6 - 20 : -20,
      r: 6 + Math.random() * 8, vy: 45 + Math.random() * 55, sw: 20 + Math.random() * 30,
      ph: Math.random() * 6.28, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 2,
      c: COLORS[(Math.random() * COLORS.length) | 0], a: 0.55 + Math.random() * 0.4 };
  }
  function drawPetal(p) {
    var r = p.r;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(1, 0.55 + 0.45 * Math.abs(Math.sin(p.ph)));
    ctx.globalAlpha = p.a;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r * 0.9, -r * 0.6, r * 0.7, r * 0.7, 0, r);
    ctx.bezierCurveTo(-r * 0.7, r * 0.7, -r * 0.9, -r * 0.6, 0, -r);
    ctx.fill();
    ctx.restore();
  }
  function frame(t) {
    var dt = Math.min((t - (lastT || t)) / 1000, 0.05);
    lastT = t;
    if (t < spawnUntil && t - lastSpawn > 350) { petals.push(mk(false)); lastSpawn = t; }
    ctx.clearRect(0, 0, W, H);
    for (var i = petals.length - 1; i >= 0; i--) {
      var p = petals[i];
      p.ph += dt * 1.6;
      p.y += p.vy * dt;
      p.x += Math.sin(p.ph) * p.sw * dt;
      p.rot += p.vr * dt;
      if (p.y > H + 24) { petals.splice(i, 1); continue; }
      drawPetal(p);
    }
    if (petals.length || t < spawnUntil) { raf = requestAnimationFrame(frame); }
    else { raf = 0; lastT = 0; ctx.clearRect(0, 0, W, H); }
  }
  function startPetals() {
    if (reduce) return;
    for (var i = 0; i < 22; i++) petals.push(mk(true));
    spawnUntil = performance.now() + 12000;
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function stopPetals() {
    petals = []; spawnUntil = 0;
    if (raf) cancelAnimationFrame(raf);
    raf = 0; lastT = 0;
    ctx.clearRect(0, 0, W, H);
  }

  /* buka dan tutup */
  function openEnv() {
    if (stage.classList.contains('is-open') || env.classList.contains('opening')) return;
    env.classList.add('opening');
    env.setAttribute('aria-expanded', 'true');
    setTimeout(function () {
      stage.classList.add('is-open');
      typeAll();
      startPetals();
    }, reduce ? 0 : 950);
  }
  function closeEnv() {
    token++; typing = false;
    stopPetals();
    stage.classList.remove('is-open');
    env.classList.remove('opening');
    env.setAttribute('aria-expanded', 'false');
    card.classList.remove('done');
  }
  env.addEventListener('click', openEnv);
  $('#again').addEventListener('click', closeEnv);
})();
</script>
</body>
</html>
